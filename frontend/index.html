<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="数据异常监控平台 — 数据源、数据集、异常规则与异常记录的统一管理" />
  <title>Sentinel · 数据异常监控平台</title>

  <!-- Fonts: Sora (display) + Manrope (body) + JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css?v=20260826-auth-login" />
  <link rel="stylesheet" href="styles/components.css?v=20260828-tooltip-cache-fix" />
  <link rel="stylesheet" href="styles/pages.css?v=20260828-independent-deadline" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234F46E5'/%3E%3Cpath d='M16 7L25 22H7L16 7Z' stroke='white' stroke-width='2' stroke-linejoin='round' fill='none'/%3E%3Ccircle cx='16' cy='17' r='2' fill='white'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app-shell">
    <!-- ============== Sidebar ============== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L22 20H2L12 2Z"/>
            <circle cx="12" cy="15" r="1.5" fill="currentColor"/>
            <path d="M12 9V12"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Sentinel</span>
          <span class="brand-sub">ANOMALY · v2.4</span>
        </div>
      </div>

      <nav class="sidebar-nav" aria-label="主导航">
        <div class="nav-section-label">监控</div>
        <a class="nav-item" data-route="records" role="button" tabindex="0">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span>异常记录</span>
          <span class="nav-badge" id="nav-anomaly-count">12</span>
        </a>
        <a class="nav-item" data-route="anomaly-groups" role="button" tabindex="0">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/>
            <path d="M7 7h.01M7 17h.01M11 7h6M11 17h6"/>
          </svg>
          <span>异常记录组</span>
        </a>
        <a class="nav-item" data-route="rules" role="button" tabindex="0">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          <span>异常规则</span>
        </a>

        <div class="nav-section-label">数据</div>
        <a class="nav-item" data-route="datasets" role="button" tabindex="0">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="5" rx="9" ry="3"/>
            <path d="M3 5v6c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            <path d="M3 11v6c0 1.66 4 3 9 3s9-1.34 9-3v-6"/>
          </svg>
          <span>数据集</span>
        </a>
        <a class="nav-item" data-route="datasources" role="button" tabindex="0">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="8" rx="2"/>
            <rect x="2" y="14" width="20" height="8" rx="2"/>
            <line x1="6" y1="6" x2="6.01" y2="6"/>
            <line x1="6" y1="18" x2="6.01" y2="18"/>
          </svg>
          <span>数据源</span>
        </a>

        <div class="nav-section-label">系统</div>
        <a class="nav-item" data-route="overview" role="button" tabindex="0">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>总览</span>
        </a>
        <a class="nav-item" data-route="tests" role="button" tabindex="0">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6"/><path d="M10 9l-4.5 8.1A2.6 2.6 0 0 0 7.8 21h8.4a2.6 2.6 0 0 0 2.3-3.9L14 9"/>
            <path d="M9 3v6l-3.5 6.3"/><path d="M15 3v6l3.5 6.3"/><path d="M8 15h8"/>
          </svg>
          <span>测试</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">SY</div>
          <div class="user-meta">
            <div class="user-name">沈一鸣</div>
            <div class="user-role">数据工程师</div>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- ============== Main area ============== -->
    <div class="main-area">
      <!-- Topbar -->
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="切换侧边栏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>

        <nav class="topbar-breadcrumb" id="breadcrumb" aria-label="面包屑">
          <span class="crumb-root">Sentinel</span>
          <span class="crumb-sep">/</span>
          <span class="crumb-current">异常记录</span>
        </nav>

        <div class="topbar-spacer"></div>

        <button class="topbar-search" id="global-search-trigger" type="button" aria-label="打开全局搜索" aria-haspopup="dialog">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--color-ink-faint);">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <span class="topbar-search-label">搜索规则、数据集、记录…</span>
          <kbd class="shortcut-label">Ctrl K</kbd>
        </button>

        <button class="topbar-icon-btn global-search-mobile-trigger" id="global-search-mobile-trigger" type="button" aria-label="打开全局搜索" aria-haspopup="dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
      </header>

      <!-- Page content rendered by router -->
      <main id="page-root" class="page" role="main"></main>
    </div>
  </div>

  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- ============== Scripts ============== -->
  <script src="scripts/icons.js"></script>
  <script src="scripts/data.js?v=20260828-audit-fixes"></script>
  <script src="scripts/components.js?v=20260828-audit-fixes"></script>
  <script src="scripts/datasource.js?v=20260828-audit-fixes"></script>
  <script src="scripts/dataset.js?v=20260828-audit-fixes"></script>
  <script src="scripts/rules.js?v=20260828-audit-fixes"></script>
  <script src="scripts/records.js?v=20260828-audit-fixes"></script>
  <script src="scripts/anomaly_groups.js?v=20260828-independent-deadline"></script>
  <script src="scripts/overview.js?v=20260828-audit-fixes"></script>
  <script src="scripts/tests.js"></script>
  <script src="scripts/app.js?v=20260826-auth-login"></script>
</body>
</html>

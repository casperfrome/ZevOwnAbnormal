name: zev-own-abnormal

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4.8}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --lower-case-table-names=1
      - --default-time-zone=+08:00
      - --server-id=1848
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the ignored .env file}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zev_abnormal_app}
      MYSQL_USER: ${MYSQL_USER:-sentinel_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_app_password}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - infra
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1g}
    cpus: ${MYSQL_CPUS:-2.0}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - infra
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: ${KAFKA_MEMORY_LIMIT:-1536m}
    cpus: ${KAFKA_CPUS:-2.0}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  starrocks:
    image: starrocks/allin1-ubuntu:${STARROCKS_VERSION:-4.0.13}
    restart: unless-stopped
    ports:
      - "${STARROCKS_SQL_PORT:-9030}:9030"
      - "${STARROCKS_FE_HTTP_PORT:-8030}:8030"
      - "${STARROCKS_BE_HTTP_PORT:-8040}:8040"
    volumes:
      - starrocks-fe-meta:/data/deploy/starrocks/fe/meta
      - starrocks-be-storage:/data/deploy/starrocks/be/storage
    networks:
      - infra
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent http://127.0.0.1:8030/api/health >/dev/null
          && curl --fail --silent http://127.0.0.1:8040/api/health >/dev/null
          && mysql --connect-timeout 3 -h 127.0.0.1 -P 9030 -u root -e "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
    mem_limit: ${STARROCKS_MEMORY_LIMIT:-6g}
    cpus: ${STARROCKS_CPUS:-4.0}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  flink-lab-mysql-init:
    image: mysql:${MYSQL_VERSION:-8.4.8}
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/flink-food-lab/mysql/init.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the ignored .env file}
      FLINK_LAB_MYSQL_DATABASE: ${FLINK_LAB_MYSQL_DATABASE:-flink_food_lab}
      FLINK_LAB_MYSQL_USER: ${FLINK_LAB_MYSQL_USER:-flink_food_app}
      FLINK_LAB_MYSQL_PASSWORD: ${FLINK_LAB_MYSQL_PASSWORD:-flink_food_app_dev}
      FLINK_LAB_MYSQL_CDC_USER: ${FLINK_LAB_MYSQL_CDC_USER:-flink_food_cdc}
      FLINK_LAB_MYSQL_CDC_PASSWORD: ${FLINK_LAB_MYSQL_CDC_PASSWORD:-flink_food_cdc_dev}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./infra/flink-food-lab/mysql:/opt/flink-food-lab/mysql:ro
    networks:
      - infra
    mem_limit: 192m
    cpus: 0.25

  flink-lab-kafka-init:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    restart: "no"
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/kafka/bin/kafka-topics.sh
        --bootstrap-server kafka:29092
        --create --if-not-exists
        --topic ${FLINK_LAB_KAFKA_TOPIC:-flink-food-lab-orders-cdc}
        --partitions 3
        --replication-factor 1
        --config retention.ms=604800000
        --config cleanup.policy=delete
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - infra
    mem_limit: 256m
    cpus: 0.25

  flink-lab-starrocks-init:
    image: mysql:${MYSQL_VERSION:-8.4.8}
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/flink-food-lab/starrocks/init.sh"]
    environment:
      STARROCKS_USER: ${STARROCKS_USER:-root}
      STARROCKS_PASSWORD: ${STARROCKS_PASSWORD:-}
      FLINK_LAB_STARROCKS_DATABASE: ${FLINK_LAB_STARROCKS_DATABASE:-flink_food_lab_warehouse}
    depends_on:
      starrocks:
        condition: service_healthy
    volumes:
      - ./infra/flink-food-lab/starrocks:/opt/flink-food-lab/starrocks:ro
    networks:
      - infra
    mem_limit: 192m
    cpus: 0.25

  debezium-connect:
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION:-3.6.2.Final}
    restart: unless-stopped
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: flink-food-lab-connect
      CONFIG_STORAGE_TOPIC: flink-food-lab-connect-configs
      OFFSET_STORAGE_TOPIC: flink-food-lab-connect-offsets
      STATUS_STORAGE_TOPIC: flink-food-lab-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_DISCOVERY: service_load
      HEAP_OPTS: -Xms128M -Xmx512M
      ENABLE_DEBEZIUM_SCRIPTING: "false"
    ports:
      # Docker Desktop and the local proxy share 8084 on this workstation;
      # keep the existing host binding so the requested fixed port remains usable.
      - "${DEBEZIUM_CONNECT_PORT:-8084}:8083"
    depends_on:
      flink-lab-mysql-init:
        condition: service_completed_successfully
      flink-lab-kafka-init:
        condition: service_completed_successfully
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: ${DEBEZIUM_MEMORY_LIMIT:-1024m}
    cpus: ${DEBEZIUM_CPUS:-1.0}

  flink-lab-debezium-init:
    image: curlimages/curl:${CURL_VERSION:-8.17.0}
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/flink-food-lab/debezium/register.sh"]
    environment:
      CONNECT_URL: http://debezium-connect:8083
      FLINK_LAB_MYSQL_DATABASE: ${FLINK_LAB_MYSQL_DATABASE:-flink_food_lab}
      FLINK_LAB_MYSQL_CDC_USER: ${FLINK_LAB_MYSQL_CDC_USER:-flink_food_cdc}
      FLINK_LAB_MYSQL_CDC_PASSWORD: ${FLINK_LAB_MYSQL_CDC_PASSWORD:-flink_food_cdc_dev}
      FLINK_LAB_KAFKA_TOPIC: ${FLINK_LAB_KAFKA_TOPIC:-flink-food-lab-orders-cdc}
    depends_on:
      debezium-connect:
        condition: service_healthy
    volumes:
      - ./infra/flink-food-lab/debezium:/opt/flink-food-lab/debezium:ro
    networks:
      - infra
    mem_limit: 64m
    cpus: 0.10

  flink-lab-storage-init:
    image: zev-own-abnormal/flink-food-lab:${FLINK_LAB_IMAGE_TAG:-2.3.0}
    restart: "no"
    user: root
    entrypoint: ["/bin/bash", "-ec", "chown -R 9999:9999 /opt/flink/checkpoints /opt/flink/savepoints"]
    volumes:
      - flink-lab-checkpoints:/opt/flink/checkpoints
      - flink-lab-savepoints:/opt/flink/savepoints
    networks:
      - infra
    mem_limit: 64m
    cpus: 0.10

  flink-jobmanager:
    build:
      context: ./infra/flink-food-lab/flink
      args:
        FLINK_IMAGE: ${FLINK_IMAGE:-flink:2.3.0-java17@sha256:53eb8f289313d1a03e6800d37bc2dd916bbb5341961543285bf933aa27e63e5e}
    image: zev-own-abnormal/flink-food-lab:${FLINK_LAB_IMAGE_TAG:-2.3.0}
    restart: unless-stopped
    command: jobmanager
    environment: &flink-environment
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        taskmanager.numberOfTaskSlots: 6
        jobmanager.memory.process.size: 768m
        taskmanager.memory.process.size: 2048m
        parallelism.default: 3
        execution.checkpointing.interval: 5s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        execution.checkpointing.savepoint-dir: file:///opt/flink/savepoints
        jobmanager.execution.failover-strategy: region
    ports:
      - "127.0.0.1:${FLINK_REST_PORT:-8081}:8081"
    depends_on:
      flink-lab-storage-init:
        condition: service_completed_successfully
    volumes:
      - flink-lab-checkpoints:/opt/flink/checkpoints
      - flink-lab-savepoints:/opt/flink/savepoints
      - ./infra/flink-food-lab/flink/sql:/opt/flink/sql:ro
      - ./infra/flink-food-lab/flink/scripts:/opt/flink/scripts:ro
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/overview >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${FLINK_JOBMANAGER_MEMORY_LIMIT:-1024m}
    cpus: ${FLINK_JOBMANAGER_CPUS:-1.0}

  flink-taskmanager:
    image: zev-own-abnormal/flink-food-lab:${FLINK_LAB_IMAGE_TAG:-2.3.0}
    restart: unless-stopped
    # The upstream all-in-one StarRocks image registers its BE as 127.0.0.1.
    # The connector follows that advertised address, so expose the BE HTTP port
    # on the TaskManager loopback without changing the shared StarRocks metadata.
    command:
      - /bin/bash
      - -ec
      - >-
        socat TCP-LISTEN:8040,bind=127.0.0.1,reuseaddr,fork TCP:starrocks:8040 &
        socat TCP-LISTEN:9060,bind=127.0.0.1,reuseaddr,fork TCP:starrocks:9060 &
        exec /docker-entrypoint.sh taskmanager
    environment: *flink-environment
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - flink-lab-checkpoints:/opt/flink/checkpoints
      - flink-lab-savepoints:/opt/flink/savepoints
    networks:
      - infra
    mem_limit: ${FLINK_TASKMANAGER_MEMORY_LIMIT:-2560m}
    cpus: ${FLINK_TASKMANAGER_CPUS:-2.0}

  flink-sql-gateway:
    image: zev-own-abnormal/flink-food-lab:${FLINK_LAB_IMAGE_TAG:-2.3.0}
    restart: unless-stopped
    command:
      - /bin/bash
      - -ec
      - >-
        /opt/flink/bin/sql-gateway.sh start-foreground
        -Dsql-gateway.endpoint.rest.address=0.0.0.0
        -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
        -Dsql-gateway.endpoint.rest.port=8083
        -Drest.address=flink-jobmanager
    environment: *flink-environment
    ports:
      - "127.0.0.1:${FLINK_SQL_GATEWAY_PORT:-8083}:8083"
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
    networks:
      - infra
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8083/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${FLINK_SQL_GATEWAY_MEMORY_LIMIT:-768m}
    cpus: ${FLINK_SQL_GATEWAY_CPUS:-0.75}

  flink-lab-pipeline-init:
    image: zev-own-abnormal/flink-food-lab:${FLINK_LAB_IMAGE_TAG:-2.3.0}
    restart: "no"
    entrypoint: ["/bin/bash", "/opt/flink/scripts/submit-pipeline.sh"]
    environment:
      <<: *flink-environment
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the ignored .env file}
      FLINK_LAB_MYSQL_DATABASE: ${FLINK_LAB_MYSQL_DATABASE:-flink_food_lab}
      FLINK_LAB_KAFKA_TOPIC: ${FLINK_LAB_KAFKA_TOPIC:-flink-food-lab-orders-cdc}
      FLINK_LAB_STARROCKS_DATABASE: ${FLINK_LAB_STARROCKS_DATABASE:-flink_food_lab_warehouse}
      STARROCKS_USER: ${STARROCKS_USER:-root}
      STARROCKS_PASSWORD: ${STARROCKS_PASSWORD:-}
    depends_on:
      flink-lab-debezium-init:
        condition: service_completed_successfully
      flink-lab-starrocks-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      flink-sql-gateway:
        condition: service_healthy
    volumes:
      - flink-lab-checkpoints:/opt/flink/checkpoints
      - flink-lab-savepoints:/opt/flink/savepoints
      - ./infra/flink-food-lab/flink/sql:/opt/flink/sql:ro
      - ./infra/flink-food-lab/flink/scripts:/opt/flink/scripts:ro
    networks:
      - infra
    mem_limit: 768m
    cpus: 0.75

  dolphinscheduler-postgresql:
    image: postgres:${DOLPHINSCHEDULER_POSTGRES_VERSION:-16.14-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DOLPHINSCHEDULER_DB_NAME:-dolphinscheduler}
      POSTGRES_USER: ${DOLPHINSCHEDULER_DB_USER:-dolphinscheduler}
      POSTGRES_PASSWORD: ${DOLPHINSCHEDULER_DB_PASSWORD:-dev_dolphinscheduler_password}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - dolphinscheduler-postgresql-data:/var/lib/postgresql/data
    networks:
      - infra
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready
          -U "$${POSTGRES_USER}"
          -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: ${DOLPHINSCHEDULER_POSTGRES_MEMORY_LIMIT:-512m}
    cpus: ${DOLPHINSCHEDULER_POSTGRES_CPUS:-1.0}

  dolphinscheduler-zookeeper:
    image: zookeeper:${DOLPHINSCHEDULER_ZOOKEEPER_VERSION:-3.8.4}
    restart: unless-stopped
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok,srvr
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - dolphinscheduler-zookeeper-data:/data
      - dolphinscheduler-zookeeper-datalog:/datalog
    networks:
      - infra
    healthcheck:
      test:
        - CMD-SHELL
        - zkServer.sh status 2>/dev/null | grep -q 'Mode:'
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: ${DOLPHINSCHEDULER_ZOOKEEPER_MEMORY_LIMIT:-384m}
    cpus: ${DOLPHINSCHEDULER_ZOOKEEPER_CPUS:-0.5}

  dolphinscheduler-schema-initializer:
    image: apache/dolphinscheduler-tools:${DOLPHINSCHEDULER_VERSION:-3.4.1}
    restart: "no"
    command:
      - tools/bin/upgrade-schema.sh
    environment: &dolphinscheduler-environment
      DATABASE: postgresql
      SPRING_DATASOURCE_URL: jdbc:postgresql://dolphinscheduler-postgresql:5432/${DOLPHINSCHEDULER_DB_NAME:-dolphinscheduler}
      SPRING_DATASOURCE_USERNAME: ${DOLPHINSCHEDULER_DB_USER:-dolphinscheduler}
      SPRING_DATASOURCE_PASSWORD: ${DOLPHINSCHEDULER_DB_PASSWORD:-dev_dolphinscheduler_password}
      SPRING_JACKSON_TIME_ZONE: ${TZ:-Asia/Shanghai}
      REGISTRY_ZOOKEEPER_CONNECT_STRING: dolphinscheduler-zookeeper:2181
    depends_on:
      dolphinscheduler-postgresql:
        condition: service_healthy
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
    networks:
      - infra
    mem_limit: ${DOLPHINSCHEDULER_SCHEMA_MEMORY_LIMIT:-768m}
    cpus: ${DOLPHINSCHEDULER_SCHEMA_CPUS:-1.0}

  dolphinscheduler-api:
    image: apache/dolphinscheduler-api:${DOLPHINSCHEDULER_VERSION:-3.4.1}
    restart: unless-stopped
    environment:
      <<: *dolphinscheduler-environment
      JAVA_OPTS: >-
        -server -Xms256m -Xmx512m -XX:+UseG1GC
        -Duser.timezone=${TZ:-Asia/Shanghai}
    ports:
      - "${DOLPHINSCHEDULER_API_PORT:-12345}:12345"
      - "${DOLPHINSCHEDULER_PYTHON_GATEWAY_PORT:-25333}:25333"
    depends_on: &dolphinscheduler-runtime-dependencies
      dolphinscheduler-zookeeper:
        condition: service_healthy
      dolphinscheduler-schema-initializer:
        condition: service_completed_successfully
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
      - ./infra/dolphinscheduler/plugins/dolphinscheduler-task-shell-${DOLPHINSCHEDULER_VERSION:-3.4.1}.jar:/opt/dolphinscheduler/api-server/libs/dolphinscheduler-task-shell-${DOLPHINSCHEDULER_VERSION:-3.4.1}.jar:ro
    networks:
      - infra
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:12345/dolphinscheduler/actuator/health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${DOLPHINSCHEDULER_API_MEMORY_LIMIT:-1g}
    cpus: ${DOLPHINSCHEDULER_API_CPUS:-1.0}

  dolphinscheduler-alert:
    image: apache/dolphinscheduler-alert-server:${DOLPHINSCHEDULER_VERSION:-3.4.1}
    restart: unless-stopped
    environment:
      <<: *dolphinscheduler-environment
      JAVA_OPTS: >-
        -server -Xms256m -Xmx384m -XX:+UseG1GC
        -Duser.timezone=${TZ:-Asia/Shanghai}
    depends_on: *dolphinscheduler-runtime-dependencies
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
    networks:
      - infra
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:50053/actuator/health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${DOLPHINSCHEDULER_ALERT_MEMORY_LIMIT:-768m}
    cpus: ${DOLPHINSCHEDULER_ALERT_CPUS:-0.5}

  dolphinscheduler-master:
    image: apache/dolphinscheduler-master:${DOLPHINSCHEDULER_VERSION:-3.4.1}
    restart: unless-stopped
    environment:
      <<: *dolphinscheduler-environment
      JAVA_OPTS: >-
        -server -Xms512m -Xmx1g -XX:+UseG1GC
        -Duser.timezone=${TZ:-Asia/Shanghai}
    depends_on: *dolphinscheduler-runtime-dependencies
    volumes:
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - ./infra/dolphinscheduler/plugins/dolphinscheduler-task-shell-${DOLPHINSCHEDULER_VERSION:-3.4.1}.jar:/opt/dolphinscheduler/master-server/libs/dolphinscheduler-task-shell-${DOLPHINSCHEDULER_VERSION:-3.4.1}.jar:ro
    networks:
      - infra
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:5679/actuator/health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${DOLPHINSCHEDULER_MASTER_MEMORY_LIMIT:-1536m}
    cpus: ${DOLPHINSCHEDULER_MASTER_CPUS:-1.0}

  dolphinscheduler-worker:
    image: apache/dolphinscheduler-worker:${DOLPHINSCHEDULER_VERSION:-3.4.1}
    restart: unless-stopped
    environment:
      <<: *dolphinscheduler-environment
      SENTINEL_API_BASE_URL: ${SENTINEL_DOCKER_API_BASE_URL:-http://host.docker.internal:8000}
      SENTINEL_INTERNAL_TOKEN: ${INTERNAL_EXECUTION_TOKEN:-change-this-internal-token}
      WORKER_TENANT_CONFIG_DEFAULT_TENANT_ENABLED: "true"
      JAVA_OPTS: >-
        -server -Xms512m -Xmx1536m -XX:+UseG1GC
        -Duser.timezone=${TZ:-Asia/Shanghai}
    depends_on: *dolphinscheduler-runtime-dependencies
    volumes:
      - dolphinscheduler-worker-data:/tmp/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
      - ./infra/dolphinscheduler/plugins/dolphinscheduler-task-shell-${DOLPHINSCHEDULER_VERSION:-3.4.1}.jar:/opt/dolphinscheduler/worker-server/libs/dolphinscheduler-task-shell-${DOLPHINSCHEDULER_VERSION:-3.4.1}.jar:ro
    networks:
      - infra
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:1235/actuator/health
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: ${DOLPHINSCHEDULER_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${DOLPHINSCHEDULER_WORKER_CPUS:-1.5}

